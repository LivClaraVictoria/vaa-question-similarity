# Active cluster profile — selects jobs/clusters/${CLUSTER}.sh (or jobs/clusters/local/${CLUSTER}.sh).
#
# Machine-specific settings go in jobs/cluster.local.sh (gitignored; copy cluster.local.example.sh).
# Without it, the generic profile jobs/clusters/slurm.sh is used with its defaults.
#
# Override for a single call without editing any file:
#   CLUSTER=<name> bash jobs/perfect_clones/launch_question_impact.sh
_cluster_env="${CLUSTER:-}"
if [[ -f "${PROJECT_DIR}/jobs/cluster.local.sh" ]]; then
    source "${PROJECT_DIR}/jobs/cluster.local.sh"
fi
CLUSTER="${_cluster_env:-${CLUSTER:-slurm}}"
unset _cluster_env
